name: Build, Scan, and Deploy to ECS Fargate

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-deploy:
    name: Pipeline & Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # STEP 1: Infrastructure-as-Code (IaC) Scan
      # ==========================================
      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

      # ==========================================
      # STEP 2: Secure AWS Authentication via Static Keys
      # ==========================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ==========================================
      # STEP 3: Build Docker Container Locally
      # ==========================================
      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: utc-recruiting-app
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

      # ==========================================
      # STEP 4: Container Vulnerability Scan
      # ==========================================
      - name: Run Trivy vulnerability scanner on Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/utc-recruiting-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # ==========================================
      # STEP 5: Push to ECR & Deploy to ECS Fargate
      # ==========================================
      - name: Push Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: utc-recruiting-app
          IMAGE_TAG: latest
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster utc-application-cluster \
            --service utc-app-service \
            --force-new-deployment